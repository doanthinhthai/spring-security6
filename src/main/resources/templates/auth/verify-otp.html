<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Xác nhận OTP - UTEShop</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-primary" style="min-height: 100vh; display: flex; align-items: center;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-6 col-lg-7 col-md-9">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-2 font-weight-bold">
                                    <i class="fas fa-shield-alt text-primary mr-2"></i>Xác Nhận Mã OTP
                                </h1>
                                <p class="mb-4 small text-muted">Mã OTP gồm 6 chữ số đã được gửi tới email của bạn. Vui lòng kiểm tra hộp thư!</p>
                            </div>

                            <div th:if="${success}" class="alert alert-success small" th:text="${success}"></div>

                            <form class="user" th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
                                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger small py-2">
                                    <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
                                </div>

                                <div class="form-group">
                                    <label class="small font-weight-bold text-gray-700">Email xác thực:</label>
                                    <input type="email" class="form-control form-control-user bg-light" th:field="*{email}" readonly>
                                </div>
                                <div class="form-group">
                                    <label class="small font-weight-bold text-gray-700">Nhập mã OTP (6 chữ số):</label>
                                    <input type="text" class="form-control form-control-user text-center font-weight-bold" 
                                           style="letter-spacing: 6px; font-size: 1.25rem;" 
                                           th:field="*{otp}" maxlength="6" placeholder="000000" required autofocus>
                                    <small class="text-danger pl-3" th:errors="*{otp}"></small>
                                </div>
                                <button type="submit" class="btn btn-primary btn-user btn-block font-weight-bold">
                                    Kích Hoạt Tài Khoản
                                </button>
                            </form>

                            <form th:action="@{/resend-register-otp}" method="post" class="mt-2">
                                <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
                                <button type="submit" class="btn btn-outline-secondary btn-user btn-block font-weight-bold">
                                    Gửi lại mã OTP
                                </button>
                            </form>

                            <hr>
                            <div class="text-center">
                                <a class="small font-weight-bold" th:href="@{/login}">Quay lại trang Đăng nhập</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
