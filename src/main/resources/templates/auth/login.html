<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Đăng nhập - UTEShop</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-primary" style="min-height: 100vh; display: flex; align-items: center;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-6 col-lg-7 col-md-9">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-4 font-weight-bold">
                                    <i class="fas fa-laugh-wink text-primary mr-2"></i>UTEShop - Đăng Nhập
                                </h1>
                            </div>

                            <div th:if="${param.error}" class="alert alert-danger small">Tài khoản hoặc mật khẩu không chính xác!</div>
                            <div th:if="${param.logout}" class="alert alert-success small">Bạn đã đăng xuất thành công.</div>
                            <div th:if="${success}" class="alert alert-success small" th:text="${success}"></div>

                            <form class="user" th:action="@{/login}" method="post">
                                <div class="form-group">
                                    <input type="text" class="form-control form-control-user" name="username" placeholder="Nhập Username hoặc Email..." required autofocus>
                                </div>
                                <div class="form-group">
                                    <input type="password" class="form-control form-control-user" name="password" placeholder="Nhập Mật khẩu..." required>
                                </div>
                                <button type="submit" class="btn btn-primary btn-user btn-block font-weight-bold">
                                    Đăng Nhập
                                </button>
                            </form>
                            <hr>
                            <div class="text-center">
                                <a class="small font-weight-bold" th:href="@{/forgot-password}">Quên mật khẩu?</a>
                            </div>
                            <div class="text-center">
                                <a class="small font-weight-bold text-success" th:href="@{/register}">Tạo tài khoản mới!</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
