<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Quên mật khẩu - UTEShop</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-primary" style="min-height: 100vh; display: flex; align-items: center;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-6 col-lg-7 col-md-9">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-2 font-weight-bold">
                                    <i class="fas fa-question-circle text-primary mr-2"></i>Quên Mật Khẩu?
                                </h1>
                                <p class="mb-4 small text-muted">
                                    Đừng lo lắng! Hãy nhập địa chỉ email của bạn bên dưới, hệ thống sẽ gửi một mã OTP gồm 6 chữ số để bạn đặt lại mật khẩu mới.
                                </p>
                            </div>

                            <form class="user" th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
                                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger small py-2">
                                    <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
                                </div>

                                <div class="form-group">
                                    <input type="email" class="form-control form-control-user" th:field="*{email}" 
                                           placeholder="Nhập địa chỉ email đăng ký tài khoản..." required autofocus>
                                    <small class="text-danger pl-3" th:errors="*{email}"></small>
                                </div>
                                <button type="submit" class="btn btn-primary btn-user btn-block font-weight-bold">
                                    Gửi Mã OTP Qua Email
                                </button>
                            </form>

                            <hr>
                            <div class="text-center">
                                <a class="small font-weight-bold text-success" th:href="@{/register}">Tạo tài khoản mới!</a>
                            </div>
                            <div class="text-center">
                                <a class="small font-weight-bold" th:href="@{/login}">Đã nhớ mật khẩu? Đăng nhập ngay!</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
