<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Đăng ký tài khoản - UTEShop</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-primary" style="min-height: 100vh; display: flex; align-items: center;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-7 col-lg-8 col-md-10">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-4 font-weight-bold">
                                    <i class="fas fa-user-plus text-primary mr-2"></i>Tạo Tài Khoản Mới!
                                </h1>
                            </div>

                            <form class="user" th:action="@{/register}" th:object="${registerDTO}" method="post">
                                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger small py-2">
                                    <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
                                </div>

                                <div class="form-group row">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <input type="text" class="form-control form-control-user" th:field="*{username}" 
                                               placeholder="Tên đăng nhập (Username)..." required>
                                        <small class="text-danger pl-3" th:errors="*{username}"></small>
                                    </div>
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control form-control-user" th:field="*{fullName}" 
                                               placeholder="Họ và tên..." required>
                                        <small class="text-danger pl-3" th:errors="*{fullName}"></small>
                                    </div>
                                </div>

                                <div class="form-group">
                                    <input type="email" class="form-control form-control-user" th:field="*{email}" 
                                           placeholder="Địa chỉ Email (để nhận mã OTP)..." required>
                                    <small class="text-danger pl-3" th:errors="*{email}"></small>
                                </div>

                                <div class="form-group row">
                                    <div class="col-sm-6 mb-3 mb-sm-0">
                                        <input type="password" class="form-control form-control-user" th:field="*{password}" 
                                               placeholder="Mật khẩu (tối thiểu 6 ký tự)..." required>
                                        <small class="text-danger pl-3" th:errors="*{password}"></small>
                                    </div>
                                    <div class="col-sm-6">
                                        <input type="password" class="form-control form-control-user" th:field="*{confirmPassword}" 
                                               placeholder="Nhập lại mật khẩu..." required>
                                        <small class="text-danger pl-3" th:errors="*{confirmPassword}"></small>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary btn-user btn-block font-weight-bold">
                                    Đăng Ký & Nhận Mã OTP
                                </button>
                            </form>

                            <hr>
                            <div class="text-center">
                                <a class="small font-weight-bold" th:href="@{/forgot-password}">Quên mật khẩu?</a>
                            </div>
                            <div class="text-center">
                                <a class="small font-weight-bold text-success" th:href="@{/login}">Đã có tài khoản? Đăng nhập ngay!</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
