<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm User mới' : 'Sửa User'})}"></head>
<body>

<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow mb-4">
                <div class="card-header py-3">
                    <h6 class="m-0 font-weight-bold text-primary">
                        <i class="fas fa-user-edit mr-1"></i>
                        <span th:text="${mode == 'create' ? 'Thêm Người Dùng Mới' : 'Cập Nhật Người Dùng'}"></span>
                    </h6>
                </div>
                <div class="card-body p-4">
                    <form th:object="${userDTO}" method="post" th:action="${mode == 'create'} ? @{/users/create} : @{/users/edit/{id}(id=${userDTO.id})}">
                        
                        <div class="form-group">
                            <label class="font-weight-bold text-gray-700">Tên đăng nhập (Username):</label>
                            <input type="text" class="form-control" th:field="*{username}" th:readonly="${mode == 'edit'}" placeholder="Nhập username...">
                            <small class="text-danger" th:errors="*{username}"></small>
                        </div>

                        <div class="form-group">
                            <label class="font-weight-bold text-gray-700">Địa chỉ Email:</label>
                            <input type="email" class="form-control" th:field="*{email}" placeholder="email@gmail.com...">
                            <small class="text-danger" th:errors="*{email}"></small>
                        </div>

                        <div class="form-group">
                            <label class="font-weight-bold text-gray-700">Họ và tên đầy đủ:</label>
                            <input type="text" class="form-control" th:field="*{fullName}" placeholder="Nhập họ và tên...">
                            <small class="text-danger" th:errors="*{fullName}"></small>
                        </div>

                        <div class="form-group">
                            <label class="font-weight-bold text-gray-700">Vai trò (Role):</label>
                            <select class="form-control" th:field="*{roleName}">
                                <option value="ROLE_USER">ROLE_USER (Người dùng thông thường)</option>
                                <option value="ROLE_ADMIN">ROLE_ADMIN (Quản trị viên hệ thống)</option>
                            </select>
                        </div>

                        <div class="form-group form-check mb-4">
                            <input type="checkbox" class="form-check-input" th:field="*{enabled}" id="enabledCheck">
                            <label class="form-check-label font-weight-bold text-gray-700" for="enabledCheck">Kích hoạt tài khoản (Active)</label>
                        </div>

                        <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save mr-1"></i> Lưu thông tin</button>
                        <a th:href="@{/users}" class="btn btn-secondary px-4 ml-2">Hủy bỏ</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

</main>
</div>

</body>
</html>
