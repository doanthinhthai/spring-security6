<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Quản lý Users')}"></head>
<body>

<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800 font-weight-bold">Quản lý Người Dùng (Users)</h1>
        <a th:href="@{/users/create}" class="btn btn-primary btn-sm shadow-sm font-weight-bold">
            <i class="fas fa-user-plus fa-sm text-white-50 mr-1"></i> Thêm User mới
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle mr-1"></i> <span th:text="${success}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
    </div>

    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
            <h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-table mr-1"></i> Danh Sách Người Dùng</h6>

            <form th:action="@{/users}" method="get" class="form-inline">
                <div class="input-group input-group-sm">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo username, email, họ tên..." style="min-width: 250px;">
                    <input type="hidden" name="size" th:value="${size}">
                    <div class="input-group-append">
                        <button class="btn btn-primary" type="submit">
                            <i class="fas fa-search fa-sm"></i> Tìm kiếm
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle" width="100%" cellspacing="0">
                    <thead class="thead-light">
                        <tr>
                            <th style="width: 60px;">ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Họ và tên</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th class="text-center">Số SP</th>
                            <th class="text-center" style="width: 170px;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users.content}">
                            <td class="font-weight-bold text-gray-700" th:text="${u.id}"></td>
                            <td class="font-weight-bold text-primary" th:text="${u.username}"></td>
                            <td th:text="${u.email}"></td>
                            <td th:text="${u.fullName}"></td>
                            <td>
                                <span class="badge badge-primary px-2 py-1" th:if="${u.roleName == 'ROLE_ADMIN'}">ROLE_ADMIN</span>
                                <span class="badge badge-secondary px-2 py-1" th:unless="${u.roleName == 'ROLE_ADMIN'}" th:text="${u.roleName}"></span>
                            </td>
                            <td>
                                <span th:if="${u.enabled}" class="badge badge-success px-2 py-1"><i class="fas fa-check-circle"></i> Active</span>
                                <span th:unless="${u.enabled}" class="badge badge-danger px-2 py-1"><i class="fas fa-times-circle"></i> Inactive</span>
                            </td>
                            <td class="text-center font-weight-bold" th:text="${u.productCount}">0</td>
                            <td class="text-center">
                                <a th:href="@{/users/edit/{id}(id=${u.id})}" class="btn btn-warning btn-sm mr-1" title="Sửa">
                                    <i class="fas fa-edit"></i> Sửa
                                </a>
                                <form th:action="@{/users/delete/{id}(id=${u.id})}" method="post" style="display:inline" onsubmit="return confirm('Bạn có chắc muốn xóa user này?')">
                                    <button class="btn btn-danger btn-sm" type="submit" title="Xóa">
                                        <i class="fas fa-trash"></i> Xóa
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${users.empty}">
                            <td colspan="8" class="text-center text-muted py-4">Không có dữ liệu người dùng nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3" th:if="${users.totalPages > 0}">
                <div class="small text-muted">
                    Trang <strong th:text="${users.number + 1}">1</strong> / <strong th:text="${users.totalPages}">1</strong>
                    (Tổng: <strong th:text="${users.totalElements}">0</strong> users)
                </div>
                <nav th:if="${users.totalPages > 1}">
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${!users.hasPrevious()} ? 'disabled'">
                            <a class="page-link" th:href="@{/users(page=${users.number - 1}, size=${size}, keyword=${keyword})}">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}" th:classappend="${i == users.number} ? 'active'">
                            <a class="page-link" th:href="@{/users(page=${i}, size=${size}, keyword=${keyword})}" th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${!users.hasNext()} ? 'disabled'">
                            <a class="page-link" th:href="@{/users(page=${users.number + 1}, size=${size}, keyword=${keyword})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

</main>
</div>

</body>
</html>
