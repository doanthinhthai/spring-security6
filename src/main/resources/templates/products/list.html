<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layouts/layout :: head('Quản lý Sản phẩm')}"></head>
<body>

<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
        <h1 class="h3 mb-0 text-gray-800 font-weight-bold">Danh Sách Sản Phẩm</h1>

        <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" 
           th:href="@{/products/create}" class="btn btn-primary btn-sm shadow-sm font-weight-bold">
            <i class="fas fa-plus-circle fa-sm text-white-50 mr-1"></i> Thêm Sản phẩm
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle mr-1"></i> <span th:text="${success}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
    </div>

    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
            <h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-boxes mr-1"></i> Danh Sách Sản Phẩm Hệ Thống</h6>

            <form th:action="@{/products}" method="get" class="form-inline">
                <div class="input-group input-group-sm">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên, mô tả..." style="min-width: 240px;">
                    <input type="hidden" name="size" th:value="${size}">
                    <div class="input-group-append">
                        <button class="btn btn-primary" type="submit">
                            <i class="fas fa-search fa-sm"></i> Tìm kiếm
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle" width="100%" cellspacing="0">
                    <thead class="thead-light">
                        <tr>
                            <th style="width: 60px;">ID</th>
                            <th style="width: 90px;" class="text-center">Hình ảnh</th>
                            <th>Tên sản phẩm</th>
                            <th>Đơn giá</th>
                            <th>Người tạo</th>
                            <th th:if="${#authorization.expression('hasRole(''ADMIN'')')}" 
                                class="text-center" style="width: 170px;">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${products.content}">
                            <td class="font-weight-bold text-gray-700" th:text="${p.id}"></td>
                            <td class="text-center">
                                <img th:if="${p.imageUrl != null}" 
                                     th:src="${#strings.substringBefore(p.imageUrl, '|')}" 
                                     class="img-thumbnail shadow-sm" style="width: 55px; height: 55px; object-fit: cover;" alt="Product">
                                <span th:unless="${p.imageUrl != null}" class="badge badge-light border text-muted">No image</span>
                            </td>
                            <td>
                                <strong class="text-gray-900" th:text="${p.name}"></strong>
                                <p class="small text-muted mb-0" th:text="${p.description}"></p>
                            </td>
                            <td class="font-weight-bold text-success" 
                                th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                            <td>
                                <span class="badge badge-light border text-primary font-weight-bold" th:text="${p.username}"></span>
                            </td>
                            
                            <td th:if="${#authorization.expression('hasRole(''ADMIN'')')}" class="text-center">
                                <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-warning btn-sm mr-1" title="Sửa">
                                    <i class="fas fa-edit"></i> Sửa
                                </a>
                                <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" style="display:inline" onsubmit="return confirm('Bạn có chắc muốn xóa sản phẩm này?')">
                                    <button class="btn btn-danger btn-sm" type="submit" title="Xóa">
                                        <i class="fas fa-trash"></i> Xóa
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${products.empty}">
                            <td colspan="6" class="text-center text-muted py-4">Chưa có sản phẩm nào trong hệ thống!</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3" th:if="${products.totalPages > 0}">
                <div class="small text-muted">
                    Trang <strong th:text="${products.number + 1}">1</strong> / <strong th:text="${products.totalPages}">1</strong>
                    (Tổng: <strong th:text="${products.totalElements}">0</strong> sản phẩm)
                </div>
                <nav th:if="${products.totalPages > 1}">
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${!products.hasPrevious()} ? 'disabled'">
                            <a class="page-link" th:href="@{/products(page=${products.number - 1}, size=${size}, keyword=${keyword})}">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}" th:classappend="${i == products.number} ? 'active'">
                            <a class="page-link" th:href="@{/products(page=${i}, size=${size}, keyword=${keyword})}" th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${!products.hasNext()} ? 'disabled'">
                            <a class="page-link" th:href="@{/products(page=${products.number + 1}, size=${size}, keyword=${keyword})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

</main>
</div>

</body>
</html>
