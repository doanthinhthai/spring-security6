<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Thông báo lỗi')}"></head>
<body>

<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>

    <div class="text-center py-5">
        <div class="error mx-auto font-weight-bold text-danger" 
             style="font-size: 6rem; line-height: 1;" 
             th:text="${status ?: 403}">403</div>
        <p class="lead text-gray-800 mb-2 font-weight-bold" 
           th:text="${error ?: 'Truy Cập Bị Từ Chối (Access Denied)'}">Thông Báo Lỗi</p>
        <p class="text-gray-500 mb-4 px-3" 
           th:text="${message ?: 'Bạn không có quyền hạn quản trị viên để thực hiện thao tác này!'}">
            Đã có lỗi xảy ra trong quá trình xử lý yêu cầu!
        </p>
        <a th:href="@{/}" class="btn btn-primary font-weight-bold shadow-sm">
            <i class="fas fa-arrow-left fa-sm mr-1"></i> Quay về Bảng Điều Khiển
        </a>
    </div>

</main>
</div>

</body>
</html>
