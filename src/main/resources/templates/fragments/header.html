<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

	<nav th:fragment="header"
		class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">

		<button id="sidebarToggleTop"
			class="btn btn-link d-md-none rounded-circle mr-3">
			<i class="fa fa-bars"></i>
		</button>

		<form
			class="d-none d-sm-inline-block form-inline mr-auto ml-md-3 my-2 my-md-0 mw-100 navbar-search"
			th:action="@{/products}" method="get">
			<div class="input-group">
				<input type="text" name="keyword" th:value="${keyword}"
					class="form-control bg-light border-0 small"
					placeholder="Tìm kiếm sản phẩm nhanh..." aria-label="Search">
				<div class="input-group-append">
					<button class="btn btn-primary" type="submit">
						<i class="fas fa-search fa-sm"></i>
					</button>
				</div>
			</div>
		</form>

		<ul class="navbar-nav ml-auto">

			<div class="topbar-divider d-none d-sm-block"></div>

			<li class="nav-item dropdown no-arrow"
				th:if="${#authorization.expression('isAuthenticated()')}"><a
				class="nav-link dropdown-toggle" href="#" id="userDropdown"
				role="button" data-toggle="dropdown" aria-haspopup="true"
				aria-expanded="false"> <span
					class="mr-2 d-none d-lg-inline text-gray-700 font-weight-bold"
					th:text="${#authentication.principal.fullName}">Thái Doãn
						Thịnh</span> <img class="img-profile rounded-circle border"
					src="https://startbootstrap.github.io/startbootstrap-sb-admin-2/img/undraw_profile.svg"
					width="32" height="32">
			</a>
				<div
					class="dropdown-menu dropdown-menu-right shadow animated--grow-in"
					aria-labelledby="userDropdown">
					<a class="dropdown-item" href="#"> <i
						class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i> Tài khoản:
						<strong th:text="${#authentication.name}">thinh</strong>
					</a> <a class="dropdown-item" href="#"> <i
						class="fas fa-id-badge fa-sm fa-fw mr-2 text-gray-400"></i> Vai
						trò: <span class="badge badge-info"
						th:text="${#authentication.principal.role}">ROLE_USER</span>
					</a>
					<div class="dropdown-divider"></div>
					<a class="dropdown-item text-danger font-weight-bold" href="#"
						data-toggle="modal" data-target="#logoutModal"> <i
						class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-danger"></i> Đăng
						xuất
					</a>
				</div></li>

			<li class="nav-item"
				th:unless="${#authorization.expression('isAuthenticated()')}">
				<a class="btn btn-primary btn-sm my-auto font-weight-bold px-3"
				th:href="@{/login}"> <i class="fas fa-sign-in-alt mr-1"></i>
					Đăng nhập
			</a>
			</li>

		</ul>

	</nav>

</body>
</html>
