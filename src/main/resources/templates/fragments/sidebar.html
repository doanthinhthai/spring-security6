<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<ul th:fragment="sidebar" class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">

    <a class="sidebar-brand d-flex align-items-center justify-content-center" th:href="@{/products}">
        <div class="sidebar-brand-icon rotate-n-15">
            <i class="fas fa-laugh-wink"></i>
        </div>
        <div class="sidebar-brand-text mx-3">UTEShop <sup>2.0</sup></div>
    </a>

    <hr class="sidebar-divider my-0">

    <li class="nav-item" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
        <a class="nav-link" th:href="@{/}">
            <i class="fas fa-fw fa-tachometer-alt"></i>
            <span>Dashboard</span>
        </a>
    </li>

    <hr class="sidebar-divider" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">

    <div class="sidebar-heading">Danh mục</div>

    <li class="nav-item">
        <a class="nav-link" th:href="@{/products}">
            <i class="fas fa-fw fa-box-open"></i>
            <span>Sản phẩm</span>
        </a>
    </li>

    <li class="nav-item" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
        <a class="nav-link" th:href="@{/users}">
            <i class="fas fa-fw fa-users"></i>
            <span>Quản lý Users (Admin)</span>
        </a>
    </li>

    <hr class="sidebar-divider d-none d-md-block">

    <div class="text-center d-none d-md-inline">
        <button class="rounded-circle border-0" id="sidebarToggle"></button>
    </div>

</ul>

</body>
</html>
